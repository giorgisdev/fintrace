name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the minimum the README states; 3.14 is what we develop on.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Without Tesseract the end-to-end OCR tests are skipped, not failed.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      # -rs lists any skipped tests, so a missing Tesseract shows up in the log.
      - name: Run tests
        run: python -m pytest -rs
